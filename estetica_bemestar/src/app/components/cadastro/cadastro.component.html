<div class="container-cadastro">
    <h2>Cadastro de Cliente</h2>
  
    <form [formGroup]="formCadastro" (ngSubmit)="salvar()">
      
      <fieldset>
        <legend>Informações Pessoais</legend>
        
        <div>
          <label>Nome Completo:</label>
          <input type="text" formControlName="nome">
        </div>
  
        <div>
          <label>CPF (somente números):</label>
          <input type="text" formControlName="cpf" maxlength="11">
        </div>
  
        <div>
          <label>Data de Nascimento:</label>
          <input type="date" formControlName="data_nascimento">
        </div>
  
        <div>
          <label>Sexo:</label>
          <select formControlName="sexo">
            <option value="">Selecione</option>
            <option value="M">Masculino</option>
            <option value="F">Feminino</option>
          </select>
        </div>
  
        <div>
          <label>E-mail:</label>
          <input type="email" formControlName="email">
        </div>
  
        <div>
          <label>Telefone:</label>
          <input type="text" formControlName="telefone">
        </div>
      </fieldset>
  
      <!-- Dados do Endereço -->
      <fieldset>
        <legend>Endereço</legend>
  
        <div>
          <label>CEP:</label>
          <input type="text" formControlName="cep" maxlength="8">
        </div>
  
        <div>
          <label>Número:</label>
          <input type="text" formControlName="numero">
        </div>
  
        <div>
          <label>Complemento:</label>
          <input type="text" formControlName="complemento">
        </div>
      </fieldset>
  
      <!-- Ações Principais -->
      <div class="acoes">
        <button type="submit">Salvar</button>
        <button type="button" (click)="limpar()">Limpar</button>
        <button type="button" (click)="voltarAoCatalogo()">Voltar ao Catálogo</button>
      </div>
  
    </form>
  </div>
