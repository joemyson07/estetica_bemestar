<div class="clientes-container">
    <header class="page-header">
      <h1>Gerenciamento de Clientes</h1>
    </header>
  
    <div *ngIf="erro" class="alerta erro">{{ erro }}</div>
    <div *ngIf="carregando" class="alerta info">Carregando dados...</div>
  
    <!-- Tabela de Listagem -->
    <div *ngIf="!carregando && !formularioAberto" class="tabela-wrapper">
      <table class="tabela-dados">
        <thead>
          <tr>
            <th>Nome</th>
            <th>CPF</th>
            <th>Email</th>
            <th>Telefone</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let cliente of clientes">
            <td>{{ cliente.nome }}</td>
            <td>{{ cliente.cpf }}</td>
            <td>{{ cliente.email }}</td>
            <td>{{ cliente.telefone }}</td>
            <td class="acoes">
              <button class="btn-sm btn-editar" (click)="abrirFormulario(cliente)">Editar</button>
              <button class="btn-sm btn-excluir" (click)="excluirCliente(cliente.idPessoa, cliente.nome)">Excluir</button>
            </td>
          </tr>
          <tr *ngIf="clientes.length === 0">
            <td colspan="5" class="sem-dados">Nenhum cliente encontrado.</td>
          </tr>
        </tbody>
      </table>
    </div>
  
    <!-- Formulário de Edição -->
    <div *ngIf="formularioAberto" class="formulario-card">
      <h2>{{ modoEdicao ? 'Editar Cliente' : 'Novo Cliente' }}</h2>
      
      <div class="form-grid">
        <!-- Dados Pessoais -->
        <div class="form-section">
          <h3>Dados Pessoais</h3>
          <div class="input-group">
            <label>Nome Completo *</label>
            <input type="text" [(ngModel)]="formData.nome" required>
          </div>
          <div class="input-row">
            <div class="input-group">
              <label>CPF * (apenas números)</label>
              <input type="text" [(ngModel)]="formData.cpf" maxlength="11" required>
            </div>
            <div class="input-group">
              <label>Data de Nascimento *</label>
              <input type="date" [(ngModel)]="formData.dataNascimento" required>
            </div>
          </div>
          <div class="input-row">
            <div class="input-group">
              <label>Sexo *</label>
              <select [(ngModel)]="formData.sexo">
                <option value="M">Masculino</option>
                <option value="F">Feminino</option>
                <option value="O">Outro</option>
              </select>
            </div>
            <div class="input-group">
              <label>Telefone</label>
              <input type="text" [(ngModel)]="formData.telefone">
            </div>
          </div>
          <div class="input-group">
            <label>E-mail *</label>
            <input type="email" [(ngModel)]="formData.email" required>
          </div>
        </div>
  
        <!-- Endereço -->
        <div class="form-section full-width">
          <h3>Endereço</h3>
          <div class="input-row">
            <div class="input-group">
              <label>CEP</label>
              <input type="text" [(ngModel)]="formData.endereco.cep" maxlength="8">
            </div>
            <div class="input-group">
              <label>Número *</label>
              <input type="text" [(ngModel)]="formData.endereco.numero" required>
            </div>
            <div class="input-group">
              <label>Complemento</label>
              <input type="text" [(ngModel)]="formData.endereco.complemento">
            </div>
          </div>
        </div>
      </div>
  
      <div class="form-actions">
        <button class="btn-secondary" (click)="fecharFormulario()">Cancelar</button>
        <button class="btn-primary" (click)="salvarCliente()">Salvar Cliente</button>
      </div>
    </div>
  </div>
